<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419"/>
      <stop offset="100%" stop-color="#070709"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1a24"/>
      <stop offset="100%" stop-color="#c4000b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#e30613" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#252530" stroke-width="6"/>

  <!-- Subtle automotive metallic accent arc -->
  <path d="M 64 256 A 192 192 0 0 1 448 256" fill="none" stroke="#e30613" stroke-width="6" opacity="0.4" stroke-dasharray="16 12"/>

  <!-- Logo text: DnD with the red 'n' -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Arial Black', Impact, sans-serif" font-weight="900" font-size="200" text-anchor="middle" dominant-baseline="central">
    <!-- D (white) -->
    <text x="145" y="258" fill="#ffffff" letter-spacing="-4">D</text>
    <!-- n (red vibrant) -->
    <text x="256" y="252" fill="url(#redGrad)" filter="url(#glow)">n</text>
    <!-- D (white) -->
    <text x="367" y="258" fill="#ffffff" letter-spacing="-4">D</text>
  </g>

  <!-- Bottom small descriptor pill: SERVIÇOS AUTOMOTIVOS -->
  <rect x="96" y="388" width="320" height="36" rx="18" fill="#e30613"/>
  <text x="256" y="407" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="18" fill="#ffffff" text-anchor="middle" dominant-baseline="central" letter-spacing="4">OFICINA</text>
</svg>
